name: ci

on:
  push:
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: hookrelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d hookrelay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://ci:ci_password@localhost:5432/hookrelay_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 ./...

      - name: go test -race
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci_password
          POSTGRES_DB=hookrelay_test
          SERVER_PORT=8080
          APP_MODE=api
          EOF
          echo "HOOKRELAY_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env

      - name: docker compose config
        run: docker compose config --quiet

      - name: docker compose build
        run: docker compose build

      - name: docker compose up + smoke
        run: |
          docker compose up -d --build
          # Ждём healthy postgres и завершения migrate.
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' hookrelay-postgres-1 2>/dev/null || true)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker compose ps
          # API доступен после миграций.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
          curl -sf http://localhost:8080/health
          # Миграции применены ровно один раз.
          docker compose logs migrate | grep -c "migration applied"
          test "$(docker compose logs migrate | grep -c 'migration applied')" -eq 6
          # Повторный запуск migrate — no-op, состояние не повреждено.
          docker compose run --rm migrate | tee /tmp/migrate2.log
          grep -q "nothing to apply" /tmp/migrate2.log
          docker compose down -v
